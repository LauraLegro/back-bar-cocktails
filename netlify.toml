[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  # EJS templates aren't picked up by the function bundler's automatic
  # require()-tracing, so they need to be included explicitly.
  included_files = ["views/**"]

[[redirects]]
  from = "/*"
  to = "/.netlify/functions/server/:splat"
  status = 200
